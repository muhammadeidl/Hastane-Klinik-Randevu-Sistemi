
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giris Yap - Randevu Sistemi</title>
</head>

<body>
    <h1>Kullanici Girisi</h1>

    {% if hata %}
        <p style="color: red;">{{ hata }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('giris') }}">

        <p>
            <label for="eposta">E-posta:</label>
            <input
                type="email"
                id="eposta"
                name="eposta"
                required
            >
        </p>

        <p>
            <label for="sifre">Sifre:</label>
            <input
                type="password"
                id="sifre"
                name="sifre"
                required
            >
        </p>

        <button type="submit">Giris Yap</button>
    </form>

    <p>
        Hesabiniz yok mu?
        <a href="{{ url_for('kayit') }}">Kayit Ol</a>
    </p>
</body>
</html>
