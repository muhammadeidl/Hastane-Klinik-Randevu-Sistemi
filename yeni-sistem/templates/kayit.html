
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hasta Kayit - Randevu Sistemi</title>
</head>
<body>
    <h1>Hasta Kayit Formu</h1>

    {% if hata %}
        <p style="color: red;">{{ hata }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('kayit') }}">
        <label for="ad">Ad Soyad:</label>
        <input type="text" id="ad" name="ad" maxlength="120" required>

        <p>
            <label for="eposta">E-posta:</label>
            <input type="email" id="eposta" name="eposta" required>
        </p>

        <p>
            <label for="sifre">Sifre:</label>
            <input type="password" id="sifre" name="sifre" minlength="12" required>
        </p>

        <p>
            <label for="sifre_tekrar">Sifre Tekrar:</label>
            <input type="password" id="sifre_tekrar" name="sifre_tekrar" required>
        </p>

        <button type="submit">Kayit Ol</button>
    </form>
</body>
</html>
